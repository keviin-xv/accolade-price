name: Accolade 房态自动抓取

on:
  schedule:
    # 动态数据：每天 10:00 / 13:00 / 17:00（悉尼时间 = UTC+10）
    - cron: '0 0 * * *'
    - cron: '0 3 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch: {}   # 支持手动触发

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行抓取流水线
        run: python3 pipeline.py

      - name: 提交更新
        run: |
          git config user.name "accolade-bot"
          git config user.email "accolade-bot@users.noreply.github.com"
          git add -A
          git commit -m "auto: 房态数据更新 $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "无变化，跳过提交"
          git push

      - name: 部署到 Cloudflare Pages
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          mkdir -p /tmp/deploy
          cp "$GITHUB_WORKSPACE/rooms.html" /tmp/deploy/index.html
          cd /tmp/deploy
          CF_API_TOKEN="$CF_API_TOKEN" CF_ACCOUNT_ID="$CF_ACCOUNT_ID" \
            npx -y @adamburgess/cloudflare-pages-direct-uploader --branch=main accolade-price /tmp/deploy
